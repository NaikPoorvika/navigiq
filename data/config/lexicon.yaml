# data/config/lexicon.yaml
#
# Deterministic phrase -> controlled vocabulary map (ADR-024).
#
# Used by the rule layer of intent classification, by discovery parsing (no
# LLM needed for "cheap nature places") and to post-process LLM extraction:
# any interest the model returns must survive this vocabulary.
#
# Each entry maps phrases (lowercase; matched on word boundaries after
# normalisation) to any of:
#   categories: taxonomy v2 category keys
#   tags:       experience tags
#   moods:      moods
# Covers English, conversational English, common Hinglish and romanized
# Kannada, and a few Kannada-script words.

version: 1

entries:
