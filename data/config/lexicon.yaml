# Words that negate the interest that follows them ("no malls", "not malls",
# "don't want malls", "avoid crowded places", "without temples").
negators: [
  "no", "not", "don't want", "dont want", "do not want", "don't like", "dont like",
  "do not like", "hate", "avoid", "without", "except", "other than", "skip", "no more",
  "not into", "anything but", "bina",
  "preferably not", "rather not", "not interested in", "except for", "exclude", "excluding",
  "minus", "never"
]

# Negators that FOLLOW what they negate (Hindi, Kannada): "mall nahi", "mall beda".
postfix_negators: ["nahi", "nahin", "nahi chahiye", "nahi jaana", "mat", "beda", "bedaa", "ಬೇಡ",
                   "not please", "not needed"]

# Phrases that describe a crowd preference rather than an interest to avoid.
crowd_phrases: ["crowded", "crowds", "crowd", "busy places", "rush", "packed", "bheed", "rush-y"]
