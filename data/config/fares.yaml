# data/config/fares.yaml
#
# NQ-015 - Deterministic cost estimation. NOT live pricing.
#
# Every figure here is an ESTIMATE derived from published fare structures.
# NavigIQ does not and will not call a ride-hailing pricing API (ADR: no paid
# providers). All user-facing output must be labelled "estimated".
#
# valid_from lets a stale table be detected rather than silently trusted.

version: 1
valid_from: 2026-09-03
currency: INR
source_note: >
  Auto and cab rates from published Bengaluru fare structures. Metro fares
  from the Namma Metro distance-band table. Figures are approximate and
  should be reviewed periodically.

auto:
  minimum_fare: 30          # covers the first 2 km
  minimum_km: 2.0
  per_km: 15
  waiting_per_min: 1
  hail_overhead_min: 5      # realistic time to find and board an auto
  night_multiplier: 1.5     # 22:00-05:00
  night_start_min: 1320
  night_end_min: 300

cab:
  minimum_fare: 50
  minimum_km: 2.0
  per_km: 18
  waiting_per_min: 1
  hail_overhead_min: 6      # app booking and driver arrival
  surge_multiplier: 1.0     # NOT live surge. Held at 1.0 deliberately.

own_car:
  per_km: 8                 # fuel only
  parking_flat: 40
  parking_overhead_min: 8

metro:
  # Namma Metro distance bands. km is the upper bound of each band.
  bands:
    - {max_km: 2,  fare: 10}
    - {max_km: 4,  fare: 20}
    - {max_km: 6,  fare: 30}
    - {max_km: 8,  fare: 40}
    - {max_km: 12, fare: 50}
    - {max_km: 18, fare: 60}
    - {max_km: 25, fare: 70}
    - {max_km: 999, fare: 90}
  access_overhead_min: 8    # walk to platform, security, wait

walking:
  per_km: 0

bike:
  per_km: 0
