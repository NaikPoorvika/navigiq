# data/mappings/osm_categories.yaml
#
# OSM tags -> NavigIQ taxonomy v2 (ADR-024, ADR-026).
#
# ORDERED RULES, FIRST MATCH WINS. More specific rules come first (a museum
# named "... Science ..." is `science`, a Hindu place of worship is `temple`).
# Deterministic, versioned, diffable. No model is involved in this path.
#
# match:     every key must hold. A string is an exact value, a list is any
#            of those values, "*" means the key exists.
# name_regex: optional case-insensitive regex on the name.
# requires:  name | wikidata | notable (wikidata OR wikipedia OR tourism OR
#            heritage tag) - records failing a requirement are DROPPED.
# min_extent_m: minimum bounding-box diagonal for areas (drops tiny ponds);
#            nodes carry no extent and pass only when they also have wikidata.
# secondary: extra category links with weights 0-1.
# tags:      experience tags implied by the rule (on top of category defaults).

version: 2

rules:
  # --- food & drink ------------------------------------------------------------
  - {match: {amenity: cafe}, category: cafe}
  - {match: {shop: [coffee, tea]}, category: cafe}
  - {match: {amenity: ice_cream}, category: dessert}
  - {match: {shop: [bakery, confectionery, pastry]}, category: dessert,
     secondary: [{category: cafe, weight: 0.4}]}
  - {match: {amenity: [restaurant, food_court]}, category: restaurant}
  - {match: {amenity: fast_food}, category: street_food,
     secondary: [{category: restaurant, weight: 0.4}], tags: [budget]}
  - {match: {amenity: [bar, pub, biergarten, nightclub]}, category: nightlife}

  # --- science & culture -------------------------------------------------------
  - {match: {amenity: planetarium}, category: science, requires: [name]}
  - {match: {man_made: observatory}, category: science, requires: [name, notable]}
  - {match: {tourism: museum}, name_regex: "science|planetarium|technolog|space|aerospace",
     category: science, requires: [name]}
  - {match: {tourism: museum}, category: museum, requires: [name]}
  - {match: {tourism: gallery}, category: gallery, requires: [name]}
  - {match: {amenity: arts_centre}, category: gallery, requires: [name],
     secondary: [{category: experience, weight: 0.5}], tags: [art]}
  - {match: {amenity: [theatre, concert_hall]}, category: entertainment, requires: [name],
     tags: [cultural, music]}
  - {match: {amenity: cinema}, category: entertainment, requires: [name]}

  # --- history & heritage ------------------------------------------------------
  - {match: {historic: [palace]}, category: palace, requires: [name]}
  - {match: {historic: castle, castle_type: [palace, stately, manor]}, category: palace,
     requires: [name]}
  - {match: {historic: [fort, castle]}, category: fort, requires: [name]}
  - {match: {historic: [monument]}, category: monument, requires: [name]}
  - {match: {tourism: artwork}, category: monument, requires: [name, notable]}
  - {match: {historic: [ruins, archaeological_site, tomb, battlefield]}, category: history,
     requires: [name]}
  - {match: {historic: memorial}, category: history, requires: [name, notable]}
  - {match: {historic: [building, manor, city_gate, gate, heritage]}, category: heritage,
     requires: [name]}

  # --- spiritual (after historic, so a historic temple keeps its heritage rule
  #     only when tagged historic=*; plain places of worship land here) -------
  - {match: {amenity: place_of_worship, religion: hindu}, category: temple, requires: [name]}
  - {match: {amenity: place_of_worship, religion: christian}, category: church, requires: [name]}
  - {match: {amenity: place_of_worship, religion: muslim}, category: mosque, requires: [name]}
  - {match: {amenity: place_of_worship}, category: religious_site, requires: [name]}

  # --- nature --------------------------------------------------------------------
  - {match: {waterway: waterfall}, category: waterfall, requires: [name]}
  - {match: {natural: waterfall}, category: waterfall, requires: [name]}
  - {match: {boundary: [national_park]}, category: nature, requires: [name]}
  - {match: {leisure: nature_reserve}, category: nature, requires: [name]}
  - {match: {boundary: protected_area}, category: nature, requires: [name, notable]}
  - {match: {tourism: zoo}, category: nature, requires: [name],
     secondary: [{category: family, weight: 0.8}, {category: kids, weight: 0.8}],
     tags: [family, kids]}
  - {match: {natural: [peak, hill]}, category: hill, requires: [name],
     tags: [sunrise, sunset]}
  - {match: {natural: bare_rock}, category: viewpoint, requires: [name]}
  - {match: {tourism: viewpoint}, category: viewpoint, requires: [name],
     tags: [sunset]}
  - {match: {water: reservoir}, category: reservoir, requires: [name], min_extent_m: 300}
  - {match: {landuse: reservoir}, category: reservoir, requires: [name], min_extent_m: 300}
  - {match: {waterway: dam}, category: reservoir, requires: [name, notable]}
  - {match: {man_made: dam}, category: reservoir, requires: [name, notable]}
  - {match: {natural: water, water: [lake, pond, lagoon, oxbow]}, category: lake,
     requires: [name], min_extent_m: 250}
  - {match: {natural: water}, category: lake, requires: [name], min_extent_m: 250}
  - {match: {natural: wood}, category: forest, requires: [name], min_extent_m: 800}
  - {match: {landuse: forest}, category: forest, requires: [name], min_extent_m: 800}
  - {match: {natural: cave_entrance}, category: adventure, requires: [name]}
  - {match: {natural: cliff}, category: adventure, requires: [name, notable]}
  - {match: {leisure: garden, "garden:type": botanical}, category: garden, requires: [name]}
  - {match: {leisure: garden}, category: garden, requires: [name], min_extent_m: 60}
  - {match: {leisure: park}, category: park, requires: [name],
     secondary: [{category: nature, weight: 0.5}]}
  - {match: {tourism: picnic_site}, category: park, requires: [name]}

  # --- entertainment & activities ---------------------------------------------
  - {match: {tourism: theme_park}, category: entertainment, requires: [name],
     secondary: [{category: family, weight: 0.8}, {category: kids, weight: 0.8}],
     tags: [family, kids, group]}
  - {match: {leisure: water_park}, category: entertainment, requires: [name],
     secondary: [{category: family, weight: 0.8}, {category: kids, weight: 0.8}],
     tags: [family, kids, group]}
  - {match: {tourism: aquarium}, category: entertainment, requires: [name],
     tags: [family, kids, indoor]}
  - {match: {leisure: [amusement_arcade, bowling_alley, escape_game]}, category: gaming,
     requires: [name]}
  - {match: {amenity: [gaming_centre, gaming_lounge]}, category: gaming, requires: [name]}
  - {match: {leisure: [trampoline_park, miniature_golf, ice_rink, horse_riding]},
     category: activity, requires: [name]}
  - {match: {sport: [karting, motor]}, category: activity, requires: [name]}
  - {match: {sport: [climbing, paragliding, free_flying, zipline]}, category: adventure,
     requires: [name]}
  - {match: {leisure: golf_course}, category: activity, requires: [name], tags: [premium]}
  - {match: {leisure: stadium}, category: entertainment, requires: [name, notable],
     tags: [sports]}
  - {match: {tourism: camp_site}, category: adventure, requires: [name],
     secondary: [{category: nature, weight: 0.6}]}

  # --- experiences ---------------------------------------------------------------
  - {match: {craft: [pottery, ceramics]}, category: workshop, requires: [name]}
  - {match: {craft: [winery, brewery]}, category: experience, requires: [name]}
  - {match: {landuse: vineyard}, category: experience, requires: [name, notable]}
  - {match: {tourism: wine_cellar}, category: experience, requires: [name]}
  - {match: {place: farm}, category: farm, requires: [name, notable]}
  - {match: {tourism: [farm, agritourism]}, category: farm, requires: [name]}

  # --- shopping -------------------------------------------------------------------
  - {match: {shop: mall}, category: mall, requires: [name]}
  - {match: {shop: department_store}, category: mall, requires: [name]}
  - {match: {amenity: marketplace}, category: market, requires: [name]}
  - {match: {shop: books}, category: shopping, requires: [name], tags: [quiet, educational]}
  - {match: {shop: [craft, handicraft, art, antiques]}, category: shopping, requires: [name],
     tags: [art]}

  # --- places to wander ------------------------------------------------------------
  - {match: {highway: pedestrian}, category: walking_area, requires: [name]}
  - {match: {amenity: library}, category: other, requires: [name, notable],
     tags: [quiet, educational, indoor]}

  # --- generic attractions last ------------------------------------------------
  - {match: {tourism: attraction}, category: other, requires: [name]}
  - {match: {heritage: "*"}, category: heritage, requires: [name]}

# Localities come from these place values (the gazetteer), never from POIs.
gazetteer_place_types: [city, town, suburb, quarter, neighbourhood, village, locality, hamlet]
