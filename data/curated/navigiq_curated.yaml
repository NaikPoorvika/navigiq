# data/curated/navigiq_curated.yaml
#
# NavigIQ editorial overlay (ADR-026). See backend/app/ingestion/curated.py.
#
# RULES
#  * Never supplies coordinates. An entry annotates an existing feature
#    (match by wikidata id / source_ref / name) or creates one from recorded
#    geometry (from_wikidata / from_place / from_osm).
#  * Descriptions are experiential and editorial. No ratings, no invented
#    facts, no numbers.
#  * cost = [min, typical, max] INR PER PERSON, shown to users as an
#    ESTIMATE (cost_confidence = curated_estimate). Ranges are deliberately
#    wide where fees vary (camera, foreigner, safari tiers). Transport is
#    never included.
#  * visit_duration = [min, typical, max] minutes on site.
#  * editorial_score (0-1) is NavigIQ's confidence that a place is worth
#    suggesting unprompted. It is never shown as a rating.

version: 1

